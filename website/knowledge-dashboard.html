<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">
    <title>AI Knowledge Enhancement System - Scarmonit</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-color: #00d9ff;
            --text-color: #e0e6ed;
            --bg-dark: #0a0e1a;
            --bg-light: #1a1f2e;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --success-color: #00ff88;
            --error-color: #ff6b6b;
            --warning-color: #ffd93d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMzAiIGN5PSIzMCIgcj0iMiIgZmlsbD0iI2ZmZmZmZiIgb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==') repeat;
            animation: backgroundMove 60s linear infinite;
            opacity: 0.1;
            z-index: -1;
        }

        @keyframes backgroundMove {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 600px 600px;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 0.8rem 1.2rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        .header {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 3rem;
        }

        .header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .header .logo svg {
            margin-right: 10px;
            animation: rotateIn 1s ease-out;
        }

        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-90deg);
            }
            to {
                opacity: 1;
                transform: rotate(0deg);
            }
        }

        .header h1 {
            font-size: 3em;
            margin: 0;
            color: var(--accent-color);
            text-shadow: 2px 2px 8px rgba(0, 217, 255, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .refresh-btn {
            background: var(--accent-color);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bg-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
        }

        .refresh-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--card-border);
            animation: cardFadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 0.9rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-icon {
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        .card-value {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 5px rgba(0, 217, 255, 0.2);
        }

        .card-description {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.7);
        }

        .error-message, .success-message {
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            margin: 2rem 0;
            font-weight: 600;
            animation: fadeIn 0.5s ease-out;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .success-message {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-color);
            font-size: 1.2rem;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .agents-list {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            animation: fadeIn 1.2s ease-out;
        }

        .agents-list h2 {
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            text-shadow: 1px 1px 5px rgba(0, 217, 255, 0.2);
        }

        .agent-item {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .agent-item:last-child {
            border-bottom: none;
        }

        .agent-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .agent-name {
            font-weight: 600;
            color: var(--text-color);
            font-size: 1.1em;
        }

        .agent-details {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.25rem;
        }

        .agent-status {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .agent-status.active {
            background: var(--success-color);
            color: var(--bg-dark);
        }

        .agent-status.idle {
            background: var(--warning-color);
            color: var(--bg-dark);
        }

        .api-status {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 1000;
            animation: fadeIn 0.5s ease-out;
        }

        .api-status.connected {
            background: var(--success-color);
            color: var(--bg-dark);
        }

        .api-status.disconnected {
            background: var(--error-color);
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .header h1 {
                font-size: 2.2em;
            }
            .refresh-btn {
                padding: 0.8rem 1.5rem;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .agents-list h2 {
                text-align: center;
            }
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }

        .agents-list { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <a href="./" class="nav-link">← Back to Home</a>
    
    <div id="apiStatus" class="api-status disconnected">API Disconnected</div>
    
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 20 L70 20 L50 80 L30 20 Z" fill="var(--accent-color)" opacity="0.7"/>
                    <path d="M70 20 L50 80 L90 80 L70 20 Z" fill="var(--primary-color)" opacity="0.7"/>
                    <path d="M50 80 L30 20 L10 80 L50 80 Z" fill="var(--secondary-color)" opacity="0.7"/>
                    <circle cx="50" cy="50" r="15" fill="var(--text-color)" opacity="0.2"/>
                </svg>
                <h1>AI Knowledge Hub</h1>
            </div>
            <p>Real-time insights into our multi-agent AI capabilities and knowledge base.</p>
        </div>

        <div class="controls">
            <button id="refreshBtn" class="refresh-btn">
                <span id="refreshIcon">🔄</span>
                <span id="refreshText">Refresh Data</span>
            </button>
        </div>

        <div id="content">
            <div class="loading-state">
                <div class="spinner"></div>
                <div>Loading dashboard data...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol + '//' + window.location.host;
        
        const API_ENDPOINTS = {
            stats: API_BASE + '/api/dashboard/stats',
            agents: API_BASE + '/api/dashboard/agents'
        };

        let retryCount = 0;
        const maxRetries = 3;

        function updateApiStatus(connected) {
            const statusEl = document.getElementById('apiStatus');
            if (connected) {
                statusEl.textContent = 'API Connected';
                statusEl.className = 'api-status connected';
            } else {
                statusEl.textContent = 'API Disconnected';
                statusEl.className = 'api-status disconnected';
            }
        }

        async function loadDashboardData() {
            const contentDiv = document.getElementById('content');
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const refreshText = document.getElementById('refreshText');

            try {
                refreshBtn.disabled = true;
                refreshIcon.textContent = '⏳';
                refreshText.textContent = 'Refreshing...';

                const [statsResponse, agentsResponse] = await Promise.all([
                    fetch(API_ENDPOINTS.stats, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        signal: AbortSignal.timeout(10000) // 10 second timeout
                    }),
                    fetch(API_ENDPOINTS.agents, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        signal: AbortSignal.timeout(10000) // 10 second timeout
                    })
                ]);

                if (!statsResponse.ok || !agentsResponse.ok) {
                    throw new Error(`API Error: Stats ${statsResponse.status}, Agents ${agentsResponse.status}`);
                }

                const statsData = await statsResponse.json();
                const agentsData = await agentsResponse.json();

                if (!statsData.success || !agentsData.success) {
                    throw new Error('API returned error response');
                }

                displayDashboard(statsData.data, agentsData.data);
                updateApiStatus(true);
                retryCount = 0;

                const successMsg = document.createElement('div');
                successMsg.className = 'success-message';
                successMsg.textContent = `Dashboard data loaded successfully! (${new Date().toLocaleTimeString()})`;
                contentDiv.insertBefore(successMsg, contentDiv.firstChild);
                setTimeout(() => successMsg.remove(), 3000);

            } catch (error) {
                console.error('Error loading dashboard:', error);
                updateApiStatus(false);
                retryCount++;
                
                let errorMessage = 'Failed to load dashboard data. ';
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMessage += 'Cannot connect to server. Check if the server is running.';
                } else if (error.name === 'AbortError') {
                    errorMessage += 'Request timed out. Server may be slow to respond.';
                } else {
                    errorMessage += error.message;
                }
                
                contentDiv.innerHTML = `
                    <div class="error-message">
                        ${errorMessage}
                        <br><br>
                        <strong>Troubleshooting:</strong>
                        <ul style="text-align: left; max-width: 600px; margin: 1rem auto;">
                            <li>Verify server is running on ${API_BASE}</li>
                            <li>Check API endpoints: ${API_ENDPOINTS.stats}</li>
                            <li>Check browser console for detailed errors</li>
                            <li>Try refreshing the page</li>
                        </ul>
                        <br>
                        <strong>Retry:</strong> ${retryCount}/${maxRetries}
                        ${retryCount < maxRetries ? '<br>Automatic retry in 5 seconds...' : ''}
                    </div>
                `;
                
                if (retryCount < maxRetries) {
                    setTimeout(() => {
                        loadDashboardData();
                    }, Math.pow(2, retryCount) * 2500); 
                }
            } finally {
                refreshBtn.disabled = false;
                refreshIcon.textContent = '🔄';
                refreshText.textContent = 'Refresh Data';
            }
        }

        function displayDashboard(stats, agents) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="dashboard-grid">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Total Agents</div>
                            <div class="card-icon">🤖</div>
                        </div>
                        <div class="card-value">${stats.totalAgents}</div>
                        <div class="card-description">AI agents deployed</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Active Now</div>
                            <div class="card-icon">⚡</div>
                        </div>
                        <div class="card-value">${stats.activeAgents}</div>
                        <div class="card-description">Currently processing</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Tasks Completed</div>
                            <div class="card-icon">✅</div>
                        </div>
                        <div class="card-value">${stats.tasksCompleted}</div>
                        <div class="card-description">Total tasks completed</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Response Time</div>
                            <div class="card-icon">⏱️</div>
                        </div>
                        <div class="card-value">${stats.avgResponseTime}ms</div>
                        <div class="card-description">Average response time</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">System Uptime</div>
                            <div class="card-icon">📊</div>
                        </div>
                        <div class="card-value">${stats.uptime}</div>
                        <div class="card-description">Overall system uptime</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Knowledge Base</div>
                            <div class="card-icon">📚</div>
                        </div>
                        <div class="card-value">${stats.knowledgeBase}</div>
                        <div class="card-description">Documents indexed</div>
                    </div>
                </div>

                <div class="agents-list">
                    <h2>Active AI Agents</h2>
                    ${agents.map(agent => `
                        <div class="agent-item">
                            <div>
                                <div class="agent-name">${agent.name}</div>
                                <div class="agent-details">
                                    ${agent.tasks} tasks completed | Last seen: ${agent.lastSeen}
                                </div>
                            </div>
                            <span class="agent-status ${agent.status.toLowerCase()}">${agent.status.toUpperCase()}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        document.getElementById('refreshBtn').addEventListener('click', loadDashboardData);

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
            setInterval(loadDashboardData, 30000);

            setInterval(async () => {
                try {
                    const response = await fetch(API_BASE + '/health', { 
                        method: 'GET',
                        signal: AbortSignal.timeout(5000) 
                    });
                    updateApiStatus(response.ok);
                } catch (error) {
                    updateApiStatus(false);
                }
            }, 10000);
        });
    </script>
</body>
</html>
