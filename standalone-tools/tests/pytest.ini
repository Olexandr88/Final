[pytest]
# Pytest Configuration for Standalone Tools Test Suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Capture output (can use -s to disable)
    --capture=no
    # Coverage reporting (comment out for faster runs)
    # --cov=.
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-report=xml
    # Fail if coverage below threshold
    # --cov-fail-under=90
    # Warnings
    --strict-markers
    # Timeout for tests (in seconds) - requires pytest-timeout plugin
    # --timeout=30
    # Show durations of slowest tests
    --durations=10

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    security: marks tests as security-focused
    performance: marks tests as performance benchmarks
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests (quick validation)

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

# Timeout configuration
[timeout]
timeout = 30
timeout_method = thread
