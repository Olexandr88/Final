<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bridge Demo - Multi-Agent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        .status {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .status-item {
            text-align: center;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-indicator.connected {
            background: #28a745;
            box-shadow: 0 0 10px #28a745;
        }
        .status-indicator.disconnected {
            background: #dc3545;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .agent-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .agent-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .agent-card h3 {
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #333;
        }
        .agent-card .skills {
            color: #666;
            font-size: 0.9em;
        }
        .message-area {
            background: white;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.user {
            background: #667eea;
            color: white;
            margin-left: 20%;
        }
        .message.agent {
            background: #e9ecef;
            color: #333;
            margin-right: 20%;
        }
        .message .sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
        }
        .input-area button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .input-area button:hover {
            transform: scale(1.05);
        }
        .input-area button:active {
            transform: scale(0.95);
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .metric-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .metric-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Bridge Demo</h1>
            <p>Multi-Agent Collaboration System</p>
        </div>

        <div class="status">
            <div class="status-item">
                <span class="status-indicator" id="ws-status"></span>
                <span id="ws-label">Connecting...</span>
            </div>
            <div class="status-item">
                <strong id="agent-count">0</strong> Active Agents
            </div>
            <div class="status-item">
                <strong id="message-count">0</strong> Messages
            </div>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>📋 Connected Agents</h2>
                <div class="agent-list" id="agent-list">
                    <div class="agent-card">
                        <h3>No agents connected</h3>
                        <div class="skills">Start the bridge server to see agents</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>💬 Agent Chat</h2>
                <div class="message-area" id="messages"></div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Send a message to agents..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <div style="padding: 0 30px 30px 30px;">
            <div class="panel">
                <h2>📊 System Metrics</h2>
                <div class="metrics">
                    <div class="metric-card">
                        <div class="metric-value" id="uptime">0s</div>
                        <div class="metric-label">Uptime</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="throughput">0</div>
                        <div class="metric-label">Messages/min</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="latency">0ms</div>
                        <div class="metric-label">Avg Latency</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let startTime = Date.now();
        const messages = [];

        function connect() {
            const wsUrl = 'ws://localhost:4567';
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus(true);
                addSystemMessage('Connected to AI Bridge');

                // Register as demo client
                ws.send(JSON.stringify({
                    type: 'register',
                    id: 'demo-client',
                    role: 'user',
                    skills: ['chat'],
                    intents: ['agent.response', 'broadcast']
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                if (data.type === 'registered') {
                    addSystemMessage(`Registered as ${data.client.id}`);
                } else if (data.type === 'envelope') {
                    handleEnvelope(data.envelope);
                } else if (data.envelope) {
                    handleEnvelope(data.envelope);
                }

                messageCount++;
                document.getElementById('message-count').textContent = messageCount;
            };

            ws.onclose = () => {
                updateStatus(false);
                addSystemMessage('Disconnected from AI Bridge');
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addSystemMessage('Connection error - retrying...');
            };
        }

        function updateStatus(connected) {
            const indicator = document.getElementById('ws-status');
            const label = document.getElementById('ws-label');

            if (connected) {
                indicator.className = 'status-indicator connected';
                label.textContent = 'Connected';
            } else {
                indicator.className = 'status-indicator disconnected';
                label.textContent = 'Disconnected';
            }
        }

        function handleEnvelope(envelope) {
            const messageDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'message agent';

            const sender = envelope.from || 'System';
            const content = typeof envelope.payload === 'string'
                ? envelope.payload
                : JSON.stringify(envelope.payload, null, 2);

            msgEl.innerHTML = `
                <div class="sender">${sender}</div>
                <div>${content}</div>
            `;

            messageDiv.appendChild(msgEl);
            messageDiv.scrollTop = messageDiv.scrollHeight;

            messages.push({ time: Date.now(), ...envelope });
        }

        function addSystemMessage(text) {
            const messageDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'message agent';
            msgEl.innerHTML = `
                <div class="sender">System</div>
                <div>${text}</div>
            `;
            messageDiv.appendChild(msgEl);
            messageDiv.scrollTop = messageDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            // Show user message
            const messageDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'message user';
            msgEl.innerHTML = `
                <div class="sender">You</div>
                <div>${text}</div>
            `;
            messageDiv.appendChild(msgEl);
            messageDiv.scrollTop = messageDiv.scrollHeight;

            // Send to bridge
            ws.send(JSON.stringify({
                type: 'envelope',
                envelope: {
                    intent: 'agent.prompt',
                    from: 'demo-client',
                    taskId: 'task-' + Date.now(),
                    payload: {
                        role: 'assistant',
                        prompt: text,
                        skills: ['chat', 'analysis']
                    }
                }
            }));

            input.value = '';
        }

        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Update metrics
        setInterval(() => {
            const uptime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('uptime').textContent = uptime + 's';

            const throughput = Math.floor(messageCount / (uptime / 60));
            document.getElementById('throughput').textContent = throughput;

            if (messages.length > 1) {
                const latencies = messages.slice(-10).map((m, i, arr) => {
                    if (i === 0) return 0;
                    return arr[i].time - arr[i-1].time;
                }).filter(l => l > 0);
                const avgLatency = latencies.reduce((a, b) => a + b, 0) / latencies.length || 0;
                document.getElementById('latency').textContent = Math.round(avgLatency) + 'ms';
            }
        }, 1000);

        // Fetch active agents from HTTP API
        async function fetchAgents() {
            try {
                const response = await fetch('http://localhost:4568/status');
                const data = await response.json();

                document.getElementById('agent-count').textContent = data.connectedClients;

                if (data.clients && data.clients.length > 0) {
                    const agentList = document.getElementById('agent-list');
                    agentList.innerHTML = data.clients.map(client => `
                        <div class="agent-card">
                            <h3>${client.id}</h3>
                            <div class="skills">Role: ${client.role || 'unknown'} | Skills: ${(client.skills || []).join(', ')}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Failed to fetch agents:', error);
            }
        }

        setInterval(fetchAgents, 2000);

        // Start connection
        connect();
        fetchAgents();
    </script>
</body>
</html>
