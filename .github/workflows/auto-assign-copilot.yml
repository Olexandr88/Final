name: Auto-Assign Copilot to Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot to Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            
            // Assign Copilot to the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              assignees: ['Copilot']
            });
            
            // Add a comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: '🤖 **Copilot AI Agent has been automatically assigned to resolve this issue.**\n\nCopilot will analyze the issue and create a pull request with the solution autonomously.\n\n---\n*Powered by GitHub Copilot Autonomous Mode*'
            });
            
            console.log(`✅ Assigned Copilot to issue #${issue_number}`);
