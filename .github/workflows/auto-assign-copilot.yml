name: Auto-Assign Copilot to Issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: write
  pull-requests: write
# Add concurrency to prevent duplicate runs
concurrency:
  group: copilot-assign-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add Copilot Comment to Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            
            // Add a comment indicating Copilot is available
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: '🤖 **Copilot AI Agent is available to help resolve this issue.**\n\nYou can use GitHub Copilot to analyze the issue and create a pull request with the solution.\n\n---\n*Powered by GitHub Copilot*'
            });
            
            console.log(`✅ Added Copilot comment to issue #${issue_number}`);
