name: Code Quality Checks

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for console.log in src/
        run: |
          echo "🔍 Checking for console.log statements in src/..."
          if grep -r "console\.\(log\|error\|warn\)" src/ --include="*.js" > /dev/null; then
            echo "❌ Found console statements in src/ (use logger instead):"
            grep -rn "console\.\(log\|error\|warn\)" src/ --include="*.js"
            exit 1
          else
            echo "✅ No console statements found in src/"
          fi

      - name: Check line lengths
        run: |
          echo "📏 Checking line lengths (max 120 chars)..."
          VIOLATIONS=0
          for file in $(find src tests -name "*.js" -type f); do
            LONG_LINES=$(awk 'length>120{print FILENAME":"NR": "length" chars"; exit}' "$file")
            if [ ! -z "$LONG_LINES" ]; then
              echo "  ⚠️  $LONG_LINES"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo "❌ Found $VIOLATIONS files with long lines"
            echo "Run: source scripts/dev-utils.sh && find_long_lines"
            exit 1
          else
            echo "✅ All lines within 120 char limit"
          fi

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting
        run: npm run format:check
        continue-on-error: true

      - name: Validate syntax
        run: |
          echo "✅ Validating JavaScript syntax..."
          for file in $(find src tests -name "*.js" -type f); do
            if ! node --check "$file" 2>/dev/null; then
              echo "❌ Syntax error in: $file"
              exit 1
            fi
          done
          echo "✅ All files have valid syntax"

      - name: Check for vague TODOs
        run: |
          echo "📌 Checking for vague TODO/FIXME comments..."
          VAGUE=$(grep -rn "//\s*\(TODO\|FIXME\)\s*$" src/ --include="*.js" || true)
          if [ ! -z "$VAGUE" ]; then
            echo "⚠️  Found vague TODO/FIXME comments (add descriptions):"
            echo "$VAGUE"
            # Warning only, not blocking
          else
            echo "✅ All TODO/FIXME comments have descriptions"
          fi

      - name: Check logger usage
        run: |
          echo "📊 Logger usage statistics:"
          echo "Files with logger imports: $(grep -rl "import.*logger" src/ --include="*.js" | wc -l)"
          echo "Remaining console statements: $(grep -r "console\." src/ --include="*.js" | wc -l || echo 0)"

  tests:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        timeout-minutes: 5

      - name: Run integration tests
        run: npm run test:integration
        timeout-minutes: 10
        continue-on-error: true

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true

  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [code-quality, tests, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "- ❌ Fix code quality issues" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "- ❌ Fix failing tests" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- ✅ Review and merge when all checks pass" >> $GITHUB_STEP_SUMMARY
