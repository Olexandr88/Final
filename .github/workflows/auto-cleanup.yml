# Auto Cleanup Workflow - Runs process cleanup on schedule
# Uses the shell one-liner patterns for system maintenance

name: Auto Process Cleanup

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  cleanup-zombies:
    runs-on: ubuntu-latest
    name: Clean Zombie Processes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check running processes
        run: |
          echo "=== Current Node Processes ==="
          ps aux | grep node || true

          echo -e "\n=== Process Count ==="
          ps aux | grep node | wc -l

      - name: Find zombie Node processes
        id: find-zombies
        run: |
          # Pattern from block 40: ps awwfux | less -S
          # Find processes with low CPU but high uptime

          ZOMBIES=$(ps aux | awk '
            $8=="Z" || ($3<1 && $10~/[0-9]+:[0-9]+/ && $10!~/00:00/) {
              print $2
            }
          ' | tr '\n' ' ')

          echo "zombies=$ZOMBIES" >> $GITHUB_OUTPUT

          if [ -n "$ZOMBIES" ]; then
            echo "Found zombie PIDs: $ZOMBIES"
          else
            echo "No zombies found"
          fi

      - name: Report findings
        run: |
          echo "=== Cleanup Report ==="
          echo "Zombies found: ${{ steps.find-zombies.outputs.zombies }}"

          # Memory usage (block 37 pattern)
          echo -e "\n=== Memory Usage ==="
          ps aux | awk '{if($6 > 100000) print $6/1024 "MB " $11 " (PID: " $2 ")"}' | \
            sort -rn | head -10 || true

      - name: Create issue if zombies found
        if: steps.find-zombies.outputs.zombies != ''
        uses: actions/github-script@v7
        with:
          script: |
            const zombies = '${{ steps.find-zombies.outputs.zombies }}';

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Zombie processes detected`,
              body: `## Zombie Process Alert

              Auto-cleanup detected zombie processes:

              **PIDs:** ${zombies}

              **Recommended Actions:**
              1. Investigate why processes became zombies
              2. Check for memory leaks in AI Bridge or agents
              3. Review process lifecycle management

              **Auto-cleanup will run on next schedule.**

              ---
              _Generated by auto-cleanup.yml workflow_
              `,
              labels: ['bug', 'performance', 'auto-detected']
            });
