name: Cancel Queued Workflow Runs

# This is a one-time workflow to clear the backlog of queued runs
# Run manually with workflow_dispatch

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-queued-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Cancel all queued and pending workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`Fetching workflow runs for ${owner}/${repo}...`);
            
            // Get all workflow runs with status 'queued' or 'pending'
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100,
              status: 'queued'
            });
            
            console.log(`Found ${runs.workflow_runs.length} queued runs`);
            
            // Cancel each queued run
            let cancelled = 0;
            for (const run of runs.workflow_runs) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`✓ Cancelled run #${run.id} (${run.name})`);
                cancelled++;
              } catch (error) {
                console.log(`✗ Failed to cancel run #${run.id}: ${error.message}`);
              }
            }
            
            console.log(`\n✅ Cancelled ${cancelled} out of ${runs.workflow_runs.length} queued runs`);
            
            // Check for pending runs too
            const { data: pendingRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100,
              status: 'pending'
            });
            
            console.log(`Found ${pendingRuns.workflow_runs.length} pending runs`);
            
            let cancelledPending = 0;
            for (const run of pendingRuns.workflow_runs) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`✓ Cancelled pending run #${run.id} (${run.name})`);
                cancelledPending++;
              } catch (error) {
                console.log(`✗ Failed to cancel pending run #${run.id}: ${error.message}`);
              }
            }
            
            console.log(`\n✅ Cancelled ${cancelledPending} out of ${pendingRuns.workflow_runs.length} pending runs`);
            console.log(`\n🎉 Total cancelled: ${cancelled + cancelledPending} workflow runs`);
      
      - name: Summary
        run: |
          echo "## ✅ Workflow Run Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All queued and pending workflow runs have been cancelled." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The queue is now clear for new runs with proper concurrency controls." >> $GITHUB_STEP_SUMMARY
