name: CI
on:
  push:
    branches: [ "Scarmonit" ]
  pull_request:
    branches: [ "Scarmonit" ]
  workflow_dispatch:

# Ensure the workflow can update contents if needed
permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: write
  issues: write

# Improved concurrency settings
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      
      - name: Run Tests
        run: |
          if npm run test --if-present 2>&1 | tee test.log; then
            echo "✓ Tests passed successfully"
          else
            echo "✗ Tests failed"
            exit 1
          fi
      
      - name: Run Build
        run: |
          if npm run build --if-present 2>&1 | tee build.log; then
            echo "✓ Build completed successfully"
          else
            echo "✗ Build failed"
            exit 1
          fi
      
      - name: Run Lint
        run: |
          if npm run lint --if-present 2>&1 | tee lint.log; then
            echo "✓ Lint passed successfully"
          else
            echo "✗ Lint failed or not configured"
            exit 1
          fi
      
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test.log
            build.log
            lint.log
          retention-days: 7
