name: CI

on:
  push:
    branches: [ Scarmonit, main ]
  pull_request:
    branches: [ Scarmonit, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run Jules automation
        run: npm run jules:full
