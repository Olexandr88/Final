name: Auto Dependency Upgrades

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:  # Manual trigger

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Check for updates
        run: npm outdated || true

      - name: Update dependencies
        run: |
          npm update
          npm audit fix

      - name: Run tests
        run: npm test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: auto-update dependencies'
          title: 'Automated Dependency Updates'
          body: |
            Automated dependency updates from scheduled workflow.

            - Updated packages to latest compatible versions
            - Ran security audit fixes
            - All tests passing
          branch: auto-deps-update
          delete-branch: true
