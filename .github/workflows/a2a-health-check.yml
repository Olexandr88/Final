name: A2A System Health Check

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run system health tests
        run: |
          npm test -- tests/ai-bridge.test.js
          npm test -- tests/basic.test.js

      - name: Report status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 A2A System Health Check Failed',
              body: 'Automated health check detected system issues. Please investigate.',
              labels: ['health-check', 'automated']
            })
